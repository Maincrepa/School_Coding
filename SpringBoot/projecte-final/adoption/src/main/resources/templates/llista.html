<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Animals - Adopció</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Animals disponibles</h1>
        <a th:if="${admin}" th:href="@{/animals/new(admin=true)}" class="btn btn-success">+ Nou animal</a>
    </div>

    <div th:if="${#lists.isEmpty(animals)}" class="alert alert-info">
        No hi ha animals registrats.
    </div>

    <table th:unless="${#lists.isEmpty(animals)}" class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Nom</th>
                <th>Gènere</th>
                <th>Raça</th>
                <th>Estat de salut</th>
                <th>Estat</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="animal : ${animals}">
                <td th:text="${animal.id}"></td>
                <td th:text="${animal.name}"></td>
                <td th:text="${animal.gender}"></td>
                <td th:text="${animal.breed}"></td>
                <td th:text="${animal.healthStatus}"></td>
                <td>
                    <span th:if="${animal.adopted}" class="badge bg-secondary">Adoptat</span>
                    <span th:unless="${animal.adopted}" class="badge bg-success">Disponible</span>
                </td>
                <td>
                    <a th:href="@{/animals/{id}(id=${animal.id}, admin=${admin})}" class="btn btn-sm btn-primary">Veure</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</body>
</html>
