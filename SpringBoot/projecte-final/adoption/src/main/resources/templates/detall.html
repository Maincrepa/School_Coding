<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isNew ? 'Nou Animal' : animal.name + ' - Detall'}">Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div class="container py-4">

    <!-- Header bar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a th:href="@{/(admin=${admin})}" class="btn btn-outline-secondary">← Llista</a>
        <h1 class="mb-0" th:text="${isNew ? 'Nou Animal' : animal.name}">Animal</h1>

        <!-- Admin action buttons — only in view mode -->
        <div th:if="${admin and not edit}" class="d-flex gap-2">
            <a th:href="@{/animals/{id}(id=${animal.id}, admin=true, edit=true)}"
               class="btn btn-warning">Editar</a>
            <form th:action="@{/animals/{id}/delete(id=${animal.id})}" method="post">
                <button type="submit"
                        th:attr="data-name=${animal.name}"
                        onclick="return confirm('Eliminar ' + this.dataset.name + '?')"
                        class="btn btn-danger">Eliminar</button>
            </form>
        </div>
        <!-- Spacer when admin buttons are hidden -->
        <div th:unless="${admin and not edit}"></div>
    </div>

    <!-- ═══════════════════════════════════════════
         VIEW MODE  (edit = false)
         ═══════════════════════════════════════════ -->
    <div th:if="${not edit}">

        <!-- Main info card -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-4">

                    <!-- Left: Photo + Temperament + Description -->
                    <div class="col-md-4">
                        <div th:if="${animal.photoUrl}">
                            <img th:src="${animal.photoUrl}" alt="Foto de l'animal"
                                 class="img-fluid rounded shadow-sm w-100"
                                 style="max-height:380px;object-fit:cover">
                        </div>
                        <div th:unless="${animal.photoUrl}"
                             class="bg-light rounded d-flex align-items-center justify-content-center"
                             style="height:300px">
                            <i class="bi bi-image text-muted" style="font-size:4rem"></i>
                        </div>

                        <div th:if="${animal.temperament}" class="mt-3">
                            <p class="text-muted small text-uppercase fw-bold mb-1">Temperament</p>
                            <p class="mb-0" th:text="${animal.temperament}"></p>
                        </div>
                        <div th:if="${animal.description}" class="mt-3">
                            <p class="text-muted small text-uppercase fw-bold mb-1">Descripció</p>
                            <p class="mb-0" th:text="${animal.description}"></p>
                        </div>
                    </div>

                    <!-- Right: Name, Species, Care tip, Vertical stats, Badges -->
                    <div class="col-md-8">
                        <h2 class="mb-0" th:text="${animal.name}">Nom</h2>
                        <p class="text-muted mb-3" th:text="${animal.species?.name}">Espècie</p>

                        <!-- Species care tip -->
                        <div th:if="${animal.species?.careTip}" class="alert alert-light border-start border-4 border-primary py-2 mb-4">
                            <i class="bi bi-lightbulb text-primary me-1"></i>
                            <strong th:text="${animal.name}"></strong> és un/a
                            <strong th:text="${animal.species?.name}"></strong>.
                            La millor manera de cuidar-los és
                            <span th:text="${animal.species?.careTip}"></span>
                        </div>

                        <!-- Vertical stats -->
                        <div class="vstack">
                            <div class="d-flex align-items-center gap-3 py-2 border-bottom" th:if="${animal.gender}">
                                <img th:src="@{/placeholder.png}" width="24" height="24" style="object-fit:contain" alt="">
                                <span class="text-muted" style="width:90px;flex-shrink:0">Gènere</span>
                                <span class="fw-semibold" th:text="${animal.gender}"></span>
                            </div>
                            <div class="d-flex align-items-center gap-3 py-2 border-bottom" th:if="${ageYears != null}">
                                <img th:src="@{/placeholder.png}" width="24" height="24" style="object-fit:contain" alt="">
                                <span class="text-muted" style="width:90px;flex-shrink:0">Edat</span>
                                <span class="fw-semibold" th:text="${ageYears} + ' anys'"></span>
                            </div>
                            <div class="d-flex align-items-center gap-3 py-2 border-bottom" th:if="${animal.weight}">
                                <img th:src="@{/placeholder.png}" width="24" height="24" style="object-fit:contain" alt="">
                                <span class="text-muted" style="width:90px;flex-shrink:0">Pes</span>
                                <span class="fw-semibold" th:text="${animal.weight} + ' kg'"></span>
                            </div>
                            <div class="d-flex align-items-center gap-3 py-2 border-bottom" th:if="${animal.height}">
                                <img th:src="@{/placeholder.png}" width="24" height="24" style="object-fit:contain" alt="">
                                <span class="text-muted" style="width:90px;flex-shrink:0">Altura</span>
                                <span class="fw-semibold" th:text="${animal.height} + ' cm'"></span>
                            </div>
                            <div class="d-flex align-items-center gap-3 py-2 border-bottom" th:if="${animal.breed}">
                                <img th:src="@{/placeholder.png}" width="24" height="24" style="object-fit:contain" alt="">
                                <span class="text-muted" style="width:90px;flex-shrink:0">Raça</span>
                                <span class="fw-semibold" th:text="${animal.breed}"></span>
                            </div>
                            <div class="d-flex align-items-center gap-3 py-2 border-bottom" th:if="${animal.color}">
                                <img th:src="@{/placeholder.png}" width="24" height="24" style="object-fit:contain" alt="">
                                <span class="text-muted" style="width:90px;flex-shrink:0">Color</span>
                                <span class="fw-semibold" th:text="${animal.color}"></span>
                            </div>
                            <div class="d-flex align-items-center gap-3 py-2 border-bottom" th:if="${animal.size}">
                                <img th:src="@{/placeholder.png}" width="24" height="24" style="object-fit:contain" alt="">
                                <span class="text-muted" style="width:90px;flex-shrink:0">Mida</span>
                                <span class="fw-semibold" th:text="${animal.size}"></span>
                            </div>
                            <div class="d-flex align-items-center gap-3 py-2" th:if="${animal.healthStatus}">
                                <img th:src="@{/placeholder.png}" width="24" height="24" style="object-fit:contain" alt="">
                                <span class="text-muted" style="width:90px;flex-shrink:0">Salut</span>
                                <span class="fw-semibold" th:text="${animal.healthStatus}"></span>
                            </div>
                        </div>

                        <!-- Boolean badges -->
                        <div class="d-flex flex-wrap gap-2 mt-3">
                            <span th:if="${animal.isNeutered}" class="badge bg-secondary rounded-pill">
                                <i class="bi bi-check-circle me-1"></i>Esterilitzat</span>
                            <span th:if="${animal.isVaccinated}" class="badge bg-secondary rounded-pill">
                                <i class="bi bi-check-circle me-1"></i>Vacunat</span>
                            <span th:if="${animal.isMicrochipped}" class="badge bg-secondary rounded-pill">
                                <i class="bi bi-check-circle me-1"></i>Microxip</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Adoption status (bottom) -->
        <div th:if="${animal.adopted}" class="alert alert-success d-flex align-items-center gap-2">
            <i class="bi bi-heart-fill fs-5"></i>
            <span>Adoptat el <strong th:text="${#temporals.format(animal.adoptedDate, 'dd/MM/yyyy')}"></strong></span>
        </div>
        <div th:unless="${animal.adopted}" class="alert alert-info d-flex justify-content-between align-items-center">
            <span>
                <i class="bi bi-clock me-1"></i>
                Disponible per adopció des de
                <strong th:text="${animal.registeredDate != null ? #temporals.format(animal.registeredDate, 'dd/MM/yyyy') : '-'}"></strong>
            </span>
            <form th:action="@{/animals/{id}/adopt(id=${animal.id})}" method="post" class="mb-0">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-heart me-1"></i>Adoptar
                </button>
            </form>
        </div>

    </div>

    <!-- ═══════════════════════════════════════════
         EDIT / CREATE FORM MODE  (edit = true)
         ═══════════════════════════════════════════ -->
    <div th:if="${edit}">
        <form th:action="${isNew ? '/animals' : '/animals/' + animal.id}"
              th:object="${animal}" method="post">
            <div class="card">
                <div class="card-body">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nom *</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Gènere *</label>
                            <select class="form-select" th:field="*{gender}" required>
                                <option value="">-- Selecciona --</option>
                                <option value="M">Mascle</option>
                                <option value="F">Femella</option>
                                <option value="Altre">Altre</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Data de naixement</label>
                            <input type="date" class="form-control" th:field="*{birthDate}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Espècie *</label>
                            <select class="form-select" th:field="*{speciesId}" required>
                                <option value="">-- Selecciona espècie --</option>
                                <option th:each="sp : ${species}" th:value="${sp.id}" th:text="${sp.id} + ' - ' + ${sp.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Raça</label>
                            <input type="text" class="form-control" th:field="*{breed}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Color</label>
                            <input type="text" class="form-control" th:field="*{color}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Mida</label>
                            <select class="form-select" th:field="*{size}">
                                <option value="">-- Selecciona --</option>
                                <option value="XS">XS</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Pes (kg)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{weight}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Altura (cm)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{height}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Estat de salut</label>
                            <select class="form-select" th:field="*{healthStatus}">
                                <option value="">-- Selecciona --</option>
                                <option value="Healthy">Sa</option>
                                <option value="NeedsAttention">Necessita atenció</option>
                                <option value="UnderTreatment">En tractament</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Temperament</label>
                            <input type="text" class="form-control" th:field="*{temperament}"
                                   placeholder="ex: amigable, tímid">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Descripció</label>
                            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">URL de la foto</label>
                            <input type="url" class="form-control" th:field="*{photoUrl}"
                                   placeholder="https://...">
                        </div>

                        <!-- Boolean flags -->
                        <div class="col-12">
                            <div class="d-flex flex-wrap gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{isNeutered}" id="isNeutered">
                                    <label class="form-check-label" for="isNeutered">Esterilitzat</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{isVaccinated}" id="isVaccinated">
                                    <label class="form-check-label" for="isVaccinated">Vacunat</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{isMicrochipped}" id="isMicrochipped">
                                    <label class="form-check-label" for="isMicrochipped">Microxip</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{adopted}" id="adopted">
                                    <label class="form-check-label" for="adopted">Adoptat</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Data d'adopció</label>
                            <input type="date" class="form-control" th:field="*{adoptedDate}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">ID Adoptant</label>
                            <input type="number" class="form-control" th:field="*{adopterId}" min="1">
                        </div>

                    </div>
                </div>
                <div class="card-footer d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="${isNew} ? @{/(admin=true)} : @{/animals/{id}(id=${animal.id}, admin=true)}"
                       class="btn btn-secondary">Cancel·lar</a>
                </div>
            </div>
        </form>
    </div>

</div>
</body>
</html>
